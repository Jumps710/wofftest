<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>事故報告</title>
  <script src="https://static.worksmobile.net/static/wm/woff/edge/3.7.1/sdk.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>事故報告</h1>
    <form id="accidentForm">
      <div class="form-group">
        <label>報告者:</label>
        <input type="text" id="reporter" name="reporter" readonly>
      </div>
      <div class="form-group">
        <label>発生日:</label>
        <input type="date" name="date" required>
      </div>
      <div class="form-group">
        <label>発生時刻:</label>
        <input type="time" name="time" required>
      </div>
      <div class="form-group">
        <label>詳細:</label>
        <textarea name="details" rows="4" required></textarea>
      </div>
<div class="form-group">
  <label for="photo">写真:</label>
  <div class="file-group">
    <label for="photo" class="custom-file-label">ファイルを選択</label>
    <input type="file" id="photo" name="photo" accept="image/*" style="display: none;">
    <span class="file-name" id="fileName">ファイル未選択</span>
  </div>
  <div id="photoPreview"></div>
</div>

      <div class="button-group">
        <button type="submit">確認画面へ</button>
      </div>
    </form>
  </div>

  <div id="modal" class="modal">
    <div class="modal-content">
      <span class="close">&times;</span>
      <h2>入力内容確認</h2>
      <div id="modalSummary"></div>
      <button id="confirmSubmit">送信</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>

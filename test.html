<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>WOFF Flexテスト</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- WOFF SDK -->
  <script charset="utf-8" src="https://static.worksmobile.net/static/wm/woff/edge/3.7.1/sdk.js"></script>
  <!-- vConsole -->
  <script src="https://unpkg.com/vconsole@latest/dist/vconsole.min.js"></script>
  <script>
    const vConsole = new VConsole();
  </script>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding: 2em;
    }
    button {
      padding: 1em 2em;
      margin: 1em;
      font-size: 16px;
      border-radius: 8px;
      border: none;
      background-color: #00C300;
      color: white;
      cursor: pointer;
    }
    #channelIdDisplay {
      margin-top: 1em;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>WOFF Flexメッセージテスト</h1>
  <button id="getChannelId">チャンネルID取得</button>
  <button id="sendMessage">メッセージを送信</button>
  <div id="channelIdDisplay">チャンネルID: <span id="channelId">未取得</span></div>

  <script>
    let currentChannelId = null;

    document.addEventListener("DOMContentLoaded", function () {
      const sendBtn = document.getElementById("sendMessage");
      const getChannelBtn = document.getElementById("getChannelId");
      const channelIdSpan = document.getElementById("channelId");

      // ✅ WOFF 初期化
      woff.init({ woffId: "DoyhUDdL_7Ies0Dv4USVHA" })  // ←実際のIDに差し替え
        .then(() => {
          console.log("✅ WOFF初期化成功");
        })
        .catch((err) => {
          console.error("❌ WOFF初期化失敗:", err);
        });

      // 📡 チャンネルID取得
      getChannelBtn.addEventListener("click", async () => {
        try {
          const channelId = await woff.getChannelId();
          currentChannelId = channelId;
          channelIdSpan.textContent = channelId;
          console.log("✅ チャンネルID取得成功:", channelId);
        } catch (err) {
          console.error("❌ チャンネルID取得失敗:", err);
        }
      });

      // 💬 Flexメッセージ送信
      sendBtn.addEventListener("click", async () => {
const flexMessage = {
  type: "flex",  // 🔴 ←これが必須！
  altText: "WOFF Flexメッセージ",
  contents: {
    type: "bubble",
    body: {
      type: "box",
      layout: "vertical",
      contents: [
        {
          type: "text",
          text: "こんにちは！",
          weight: "bold",
          size: "lg"
        }
      ]
    }
  }
};


        try {
          const result = await woff.sendFlexMessage({
            content: flexMessage
          });
          console.log("✅ メッセージ送信成功:", result);
          alert("✅ メッセージ送信に成功しました！");
        } catch (err) {
          console.error("❌ メッセージ送信失敗:", err);
          alert("❌ メッセージ送信に失敗しました。詳細はvConsoleを確認してください。");
        }
      });
    });
  </script>
</body>
</html>
